<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neutron Probe Plot Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame">

  <aside class="rail">
    <header class="rail__header">
      <h1>Neutron Probe Plot Viewer</h1>
      <p class="sync" id="syncStatus">Loading data&hellip;</p>
    </header>

    <div class="field">
      <label for="modeSelect">Mode</label>
      <select id="modeSelect">
        <option value="standard">Standard plot</option>
        <option value="timeseries">Moisture change through time</option>
      </select>
    </div>

    <div class="field">
      <label for="siteSelect">Site</label>
      <select id="siteSelect"></select>
    </div>

    <div class="field">
      <label for="holeSelect">Hole ID</label>
      <select id="holeSelect"></select>
    </div>

    <div class="field defaultOnly">
      <label for="unitSelect">Cable length units</label>
      <select id="unitSelect">
        <option value="ft">Feet</option>
        <option value="m">Meters</option>
      </select>
    </div>

    <div class="field defaultOnly">
      <label for="countUnitSelect">Moisture units</label>
      <select id="countUnitSelect">
        <option value="count">Neutron Count (MD)</option>
        <option value="theta">Theta</option>
      </select>
    </div>

    <div class="field defaultOnly" id="shadeAreaField" hidden>
      <label class="checkboxLabel">
        <input type="checkbox" id="shadeAreaCheckbox">
        Calculate moisture difference
      </label>
    </div>

    <hr class="rule defaultOnly">

    <div class="field defaultOnly">
      <label>Months to plot</label>

      <div class="filterRow">
        <select id="filterMonth">
          <option value="">All months</option>
        </select>
        <select id="filterYear">
          <option value="">All years</option>
        </select>
      </div>

      <div class="actionRow">
        <button id="selectAllVisibleBtn" class="smallBtn">Select all</button>
        <button id="clearCompareBtn" class="smallBtn">Clear</button>
      </div>

      <div class="yearChecks" id="compareChecks"></div>
    </div>

    <div class="tsOnly tsPanel">
      <div class="field">
        <label>Start</label>
        <div class="filterRow">
          <select id="tsStartMonth"></select>
          <select id="tsStartYear"></select>
        </div>
      </div>
      <div class="field">
        <label>End</label>
        <div class="filterRow">
          <select id="tsEndMonth"></select>
          <select id="tsEndYear"></select>
        </div>
      </div>
      <div class="actionRow">
        <button id="tsPlayBtn" class="smallBtn">Play</button>
        <button id="tsRestartBtn" class="smallBtn">Restart</button>
      </div>
      <input type="range" id="tsScrub" min="0" max="1000" value="0" step="1">
      <p class="note" id="tsNote"></p>
    </div>

    <button id="plotBtn" class="plotBtn defaultOnly">Plot</button>
    <button id="viewFullCsvBtn" class="ghostBtn">View full CSV</button>
    <button id="viewPlottedCsvBtn" class="ghostBtn defaultOnly">View plotted rows</button>

    <p class="note" id="statusNote"></p>
  </aside>

  <main class="stage">
    <div id="plot" class="plot"></div>
    <div id="areaResult" class="areaResult" hidden></div>

    <div id="tsStage" class="tsStage">
      <div id="tsReadout" class="tsReadout"></div>
      <div class="tsPlots">
        <div id="tsProfile" class="tsPlot"></div>
        <div id="tsTime" class="tsPlot"></div>
      </div>
    </div>
  </main>

</div>

<div class="modal" id="csvModal" hidden>
  <div class="modal__panel">
    <div class="modal__header">
      <span id="csvModalTitle">CSV data</span>
      <button id="closeCsvModal" class="modal__close" aria-label="Close">&times;</button>
    </div>
    <div class="modal__scroll">
      <table id="csvTable"></table>
    </div>
    <div class="modal__footer">
      <button id="csvPrevBtn" class="pageBtn">&larr; Prev</button>
      <span id="csvPageInfo" class="pageInfo"></span>
      <button id="csvNextBtn" class="pageBtn">Next &rarr;</button>
    </div>
  </div>
</div>

<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="timeseries.js"></script>

</body>
</html>
